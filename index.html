<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViaLogic | Sovereign Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="./daxini-renderer.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a14;
            --dx-cyan: #00e5ff;
            --dx-saffron: #ff671f;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-deep);
            color: white; font-family: 'JetBrains Mono', monospace;
            overflow: hidden; user-select: none;
        }

        /* Dotted Grid Canvas Background */
        #grid-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(0, 229, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none; z-index: 1;
        }

        canvas { display: block; z-index: 2; position: relative; }

        /* Floating Command Bridge */
        #bridge {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; gap: 15px; align-items: center;
            background: rgba(10, 15, 25, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 10px 20px; border-radius: 18px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: var(--dx-cyan); letter-spacing: 2px; }

        input#search {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 229, 255, 0.15);
            padding: 8px 15px; border-radius: 10px; color: white; width: 250px;
            outline: none; font-family: 'JetBrains Mono', monospace; font-size: 13px;
        }

        input#search:focus { border-color: var(--dx-cyan); background: rgba(255, 255, 255, 0.08); }

        .filter-group { display: flex; gap: 8px; }
        .filter-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #98dce7; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 11px;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active { border-color: var(--dx-cyan); color: white; background: rgba(0, 229, 255, 0.1); }

        /* Dynamic Tooltip Container */
        #tooltip-anchor {
            position: fixed; pointer-events: none; z-index: 2000;
            transition: opacity 0.2s; opacity: 0; transform: translate(-50%, -100%);
            margin-top: -20px;
        }

        #stats-bar {
            position: fixed; bottom: 30px; left: 30px; z-index: 1000;
            font-size: 10px; color: var(--dx-saffron); letter-spacing: 2px; opacity: 0.6;
        }

        @media (max-width: 800px) {
            #bridge { width: 95%; flex-direction: column; top: 10px; }
            input#search { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="grid-overlay"></div>

    <div id="bridge">
        <div class="logo">VIALOGIC</div>
        <input type="text" id="search" placeholder="SEARCH NEURAL MESH...">
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">ALL</button>
            <button class="filter-btn" data-filter="Math">MATH</button>
            <button class="filter-btn" data-filter="Philosophy">PHILOSOPHY</button>
            <button class="filter-btn" data-filter="Revolution">REVOLUTION</button>
            <button class="filter-btn" data-filter="Modern">MODERN</button>
        </div>
    </div>

    <div id="tooltip-anchor"></div>

    <div id="stats-bar">SYSTEM: STABLE | ENTITIES: <span id="count">0</span> | VIALOGIC MAP v2.0</div>

    <script>
    let people = [];
    let nodes = [];
    let zoom = 1;
    let offset;
    let hoveredNode = null;
    let searchQuery = '';
    let currentFilter = 'all';

    const CATEGORY_ICONS = {
        'Math & Science': '📐',
        'Philosophy': '🏛️',
        'Revolution': '⚔️',
        'Sovereign': '👑',
        'Modern': '🧩'
    };

    /* ── Node Class ────────────────────────────────────────────── */
    class Node {
        constructor(person) {
            this.person = person;
            this.pos = createVector(random(width), random(height));
            this.vel = createVector(0, 0);
            this.acc = createVector(0, 0);
            this.icon = CATEGORY_ICONS[person.category] || '📐';
            this.r = 30;
            this.color = person.category.includes('Math') ? '#00e5ff' : '#ff671f';
        }

        applyForces(allNodes) {
            // Attraction to center
            let center = createVector(width/2, height/2);
            let force = p5.Vector.sub(center, this.pos);
            force.mult(0.0001);
            this.acc.add(force);

            // Repulsion from other nodes
            for (let other of allNodes) {
                if (other !== this) {
                    let d = dist(this.pos.x, this.pos.y, other.pos.x, other.pos.y);
                    if (d < 150) {
                        let repulse = p5.Vector.sub(this.pos, other.pos);
                        repulse.normalize();
                        repulse.mult(1 / (d * 0.1));
                        this.acc.add(repulse);
                    }
                }
            }

            // Mouse Repulsion
            let mouse = createVector((mouseX - offset.x) / zoom, (mouseY - offset.y) / zoom);
            let dMouse = dist(this.pos.x, this.pos.y, mouse.x, mouse.y);
            if (dMouse < 100) {
                let mRepulse = p5.Vector.sub(this.pos, mouse);
                mRepulse.normalize();
                mRepulse.mult(2);
                this.acc.add(mRepulse);
            }
        }

        update() {
            this.vel.add(this.acc);
            this.vel.mult(0.95); // Friction
            this.pos.add(this.vel);
            this.acc.mult(0);
        }

        draw() {
            let isMatch = this.matchesFilter();
            let alpha = isMatch ? 255 : 30;
            
            push();
            translate(this.pos.x, this.pos.y);
            
            // Glow
            if (isMatch) {
                noStroke();
                fill(this.color + '22');
                ellipse(0, 0, 80);
            }

            // Node Circle
            fill(isMatch ? '#0a0f19' : '#050a14');
            stroke(this.color + (isMatch ? 'ff' : '44'));
            strokeWeight(2);
            ellipse(0, 0, this.r * 2);

            // Icon
            textAlign(CENTER, CENTER);
            textSize(20);
            fill(255, alpha);
            text(this.icon, 0, 1);
            
            // Name label (subtle)
            if (isMatch && zoom > 0.6) {
                textSize(10);
                fill(255, 150);
                text(this.person.name.toUpperCase(), 0, this.r + 15);
            }
            pop();
        }

        matchesFilter() {
            const matchSearch = this.person.name.toLowerCase().includes(searchQuery.toLowerCase());
            if (currentFilter === 'all') return matchSearch;
            return matchSearch && (this.person.category.includes(currentFilter) || this.person.era.includes(currentFilter));
        }

        isHovered() {
            let mouse = createVector((mouseX - offset.x) / zoom, (mouseY - offset.y) / zoom);
            return dist(this.pos.x, this.pos.y, mouse.x, mouse.y) < this.r;
        }
    }

    /* ── Main p5.js Loop ────────────────────────────────────────── */
    async function setup() {
        createCanvas(windowWidth, windowHeight);
        offset = createVector(0, 0);
        
        try {
            const res = await fetch('./people-registry.json');
            const data = await res.json();
            people = data.people;
            document.getElementById('count').innerText = people.length;
            
            for (let p of people) {
                nodes.push(new Node(p));
            }
        } catch (e) { console.error(e); }
    }

    function draw() {
        background(5, 10, 20);
        
        push();
        translate(offset.x, offset.y);
        scale(zoom);
        
        let newHover = null;
        for (let node of nodes) {
            node.applyForces(nodes);
            node.update();
            node.draw();
            if (node.isHovered() && node.matchesFilter()) newHover = node;
        }
        pop();

        handleHover(newHover);
    }

    function handleHover(node) {
        const anchor = document.getElementById('tooltip-anchor');
        if (node && node.person) {
            if (node !== hoveredNode) {
                hoveredNode = node;
                anchor.style.opacity = 1;
                anchor.innerHTML = '';
                const card = window.DaxiniRenderer.renderCard(node.person);
                anchor.appendChild(card);
            }
            // Position tooltip relative to screen with offset
            const x = mouseX + 15;
            const y = mouseY + 15;
            anchor.style.left = x + 'px';
            anchor.style.top = y + 'px';
            anchor.style.pointerEvents = 'none'; // Ensure tooltip doesn't block mouse
        } else {
            hoveredNode = null;
            anchor.style.opacity = 0;
        }
    }

    function mousePressed() {
        if (hoveredNode) {
            window.location.href = hoveredNode.person.path;
        }
    }

    function mouseDragged() {
        offset.x += mouseX - pmouseX;
        offset.y += mouseY - pmouseY;
    }

    function mouseWheel(event) {
        zoom -= event.delta * 0.001;
        zoom = constrain(zoom, 0.2, 3);
        return false;
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }

    /* ── UI Logic ──────────────────────────────────────────────── */
    document.getElementById('search').addEventListener('input', (e) => {
        searchQuery = e.target.value;
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
        });
    });
    </script>
</body>
</html>
